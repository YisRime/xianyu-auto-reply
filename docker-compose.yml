# 闲鱼自动回复系统 - 单容器部署
# 一个镜像内含 backend-web（API + 前端页面 + 定时任务）与 websocket（IM 长连接），
# 由 supervisord 托管，共用同一个 SQLite 数据文件。
services:
  xianyu:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: ghcr.io/yisrime/xianyu-auto-reply:latest
    container_name: xianyu-auto-reply
    restart: unless-stopped
    environment:
      - DB_ENGINE=sqlite
      - SQLITE_PATH=/app/data/xianyu.db
      - HOST=0.0.0.0
      - WEBSOCKET_SERVICE_URL=http://127.0.0.1:8090
      - BACKEND_WEB_SERVICE_URL=http://127.0.0.1:8089
      - SCHEDULER_SERVICE_URL=http://127.0.0.1:8089
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - STATIC_DIR=/app/backend-web/static
      - TZ=${TZ:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - xianyu-data:/app/data
      - static-files:/app/backend-web/static
      - browser-data:/app/browser_data
    ports:
      - "${BACKEND_PORT:-8089}:8089"
      - "${WEBSOCKET_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  xianyu-data:
    driver: local
  static-files:
    driver: local
  browser-data:
    driver: local
