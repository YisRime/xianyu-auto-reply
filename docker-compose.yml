# 闲鱼自动回复系统 - 容器编排
# 当前架构：SQLite 单文件数据库，定时任务已并入 backend-web，故只需两个容器。
#   1. backend-web：HTTP API + 前端静态页面 + 定时任务调度
#   2. websocket  ：各账号的上游 IM 长连接、自动回复、自动发货
services:
  backend-web:
    build:
      context: .
      dockerfile: backend-web/Dockerfile
    image: ghcr.io/yisrime/xianyu-auto-reply-backend-web:latest
    container_name: xianyu-backend-web
    restart: unless-stopped
    environment:
      - DB_ENGINE=sqlite
      - SQLITE_PATH=/app/data/xianyu.db
      - HOST=0.0.0.0
      - WEBSOCKET_SERVICE_URL=http://websocket:8090
      - BACKEND_WEB_SERVICE_URL=http://127.0.0.1:8089
      - SCHEDULER_SERVICE_URL=http://127.0.0.1:8089
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - STATIC_DIR=/app/backend-web/static
      - TZ=${TZ:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - sqlite-data:/app/data
      - static-files:/app/backend-web/static
      - backend-logs:/app/backend-web/logs
    ports:
      - "${BACKEND_PORT:-8089}:8089"
    networks:
      - xianyu-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  websocket:
    build:
      context: .
      dockerfile: websocket/Dockerfile
    image: ghcr.io/yisrime/xianyu-auto-reply-websocket:latest
    container_name: xianyu-websocket
    restart: unless-stopped
    environment:
      - DB_ENGINE=sqlite
      - SQLITE_PATH=/app/data/xianyu.db
      - HOST=0.0.0.0
      - BACKEND_WEB_SERVICE_URL=http://backend-web:8089
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-}
      - TZ=${TZ:-Asia/Shanghai}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - sqlite-data:/app/data
      - browser-data:/app/browser_data
      - websocket-logs:/app/websocket/logs
    ports:
      - "${WEBSOCKET_PORT:-8090}:8090"
    networks:
      - xianyu-network
    depends_on:
      backend-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  xianyu-network:
    driver: bridge

volumes:
  sqlite-data:
    driver: local
  static-files:
    driver: local
  browser-data:
    driver: local
  backend-logs:
    driver: local
  websocket-logs:
    driver: local
