[mysqld]
basedir=D:/Work/xianyu-auto-reply/runtime/mariadb
datadir=D:/Work/xianyu-auto-reply/runtime/mariadb-data
port=3306
bind-address=127.0.0.1

# 单机自用：数据量很小，按最小可用配置限制内存占用
innodb_buffer_pool_size=64M
max_connections=100
thread_cache_size=16
table_open_cache=400
max_allowed_packet=256M

character-set-server=utf8mb4
collation-server=utf8mb4_unicode_ci
default-time-zone=+08:00
log-error=D:/Work/xianyu-auto-reply/runtime/mariadb-error.log
skip-name-resolve

[client]
port=3306
default-character-set=utf8mb4